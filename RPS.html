<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <script>
        console.log("Hello World");
        let choicePC = getComputerChoice();
        console.log(choicePC);

        let playerChoice = getPlayerChoice();
        console.log(playerChoice);

        let scorePC = 0;
        let scorePlayer = 0;
        console.log(alert(PlayRound()));

        function getComputerChoice()
        {
            const choices = ["Rock" , "Paper" , "Scissors"];
            let num = Math.floor(Math.random()*choices.length);

            return choices[num]; 
        }
        function getPlayerChoice()
        {
            let answ = prompt("Choose between Rock Paper or Scissors ");
            while(answ.toLowerCase() != "rock" &&
            answ.toLowerCase() != "paper" &&
            answ.toLowerCase() != "scissors" )
            {
                answ = prompt("please only pick between Rock Paper or Scissors!! ")
            }
            return answ;
        }
        function PlayRound()
        {
            playerChoice = playerChoice.toLowerCase();
            choicePC = choicePC.toLowerCase();
            let result;

            if((playerChoice === 'rock' && choicePC === 'paper') ||
              (playerChoice ==='paper' && choicePC ==='scissors') || 
              (playerChoice === 'scissors' && choicePC ==='rock'))
              {
                scorePC++;
                result = "you choose: " + playerChoice +" the system choose: "+ choicePC +" therfor you LOOSE!!! the score is : " + scorePlayer + '-' + scorePC;
              }
              else if (playerChoice === choicePC)
              {
                 result ="you choose: " + playerChoice +" the system choose: "+ choicePC +" therfor its a DRAW!!! the score is : " + scorePlayer + '-' + scorePC;

              } 
              else
              {
                scorePlayer++;
                result = "you choose: " + playerChoice +" the system choose: "+ choicePC +" therfor you WIN!!! the score is : " + scorePlayer + '-' + scorePC;
              }
              return result;
        }
    </script>
