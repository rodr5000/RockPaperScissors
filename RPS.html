<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <script>
        console.log("Hello World");
        let choicePC = getComputerChoice();
        console.log(choicePC);

        let playerChoice = getPlayerChoice();
        console.log(playerChoice);

        let scorePC = 0;
        let scorePlayer = 0;

        function getComputerChoice()
        {
            const choices = ["Rock" , "Paper" , "Scissors"];
            let num = Math.floor(Math.random()*choices.length);

            return choices[num]; 
        }
        function getPlayerChoice()
        {
            let answ = prompt("Choose between Rock Paper or Scissors ");
            while(answ.toLowerCase() != "rock" &&
            answ.toLowerCase() != "paper" &&
            answ.toLowerCase() != "scissors" )
            {
                answ = prompt("please only pick between Rock Paper or Scissors!! ")
            }
            return answ;

        }
    </script>
</body>
